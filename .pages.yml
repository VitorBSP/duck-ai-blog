media:
  input: public/media
  output: /media

content:
  - name: blog
    label: Artigos do Blog
    type: collection
    path: src/content/blog
    filename: "{primary}.mdx"
    view:
      fields: [title, project, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        description: Curto, natural e sem travessão (ideal até 65 caracteres).
      - name: description
        label: Resumo (SEO)
        type: text
        required: true
        description: 1 a 2 frases diretas (30 a 200 caracteres).
      - name: pubDate
        label: Data de publicação
        type: date
        required: true
      - name: updatedDate
        label: Data de atualização
        type: date
      - name: project
        label: Editoria / Projeto
        type: select
        required: true
        options:
          values:
            - value: blog-central
              label: Duck AI (Blog Central)
            - value: ainda-da
              label: Ainda Dá
            - value: radar-eleitoral
              label: Radar Eleitoral
      - name: campaign_id
        label: ID da Campanha
        type: string
        required: true
        description: Formato YYYY-MM-DD-slug (ex. 2026-11-23-ainda-da-exemplo).
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$"
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
      - name: readingTimeMinutes
        label: Tempo de leitura (min)
        type: number
        default: 5
      - name: draft
        label: Rascunho (draft)
        type: boolean
        default: true
        description: Desmarque apenas quando o artigo estiver pronto para publicar.
      - name: primarySources
        label: Fontes Primárias
        type: object
        list: true
        fields:
          - name: label
            label: Rótulo da fonte
            type: string
            required: true
          - name: url
            label: URL oficial
            type: string
            required: true
      - name: methodologyNote
        label: Nota Metodológica
        type: text
        description: Obrigatória para artigos do Radar Eleitoral.
      - name: ctaLabel
        label: Texto do botão CTA
        type: string
      - name: ctaUrl
        label: Link do CTA
        type: string
      - name: heroImage
        label: Imagem de capa (opcional)
        type: image
      - name: body
        label: Corpo do Artigo (MDX)
        type: code
        options:
          language: markdown
        description: Preserva imports e componentes MDX (CaixaCTA, DestaqueMetrica, NotaMetodologica). Evite travessões.
